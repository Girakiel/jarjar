services:
  jarjar:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      JARJAR_RETENTION_DAYS: "30"
      # Set both when serving over HTTPS behind a reverse proxy:
      # JARJAR_TRUST_PROXY: "true"
      # JARJAR_SECURE_COOKIES: "true"
    volumes:
      - jarjar-data:/data

volumes:
  jarjar-data:
